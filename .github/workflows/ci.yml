name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (ruff + pytest on pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: boxmind
          POSTGRES_PASSWORD: boxmind
          POSTGRES_DB: boxmind
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U boxmind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
        env:
          BOXMIND_TEST_DATABASE_URL: postgresql+psycopg://boxmind:boxmind@127.0.0.1:5434/boxmind_test

  frontend:
    name: frontend (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
