[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `pytest` (not only `python -m pytest`) must find the `app` package
asyncio_mode = "auto"
filterwarnings = [
    "error",  # a new deprecation or SQLAlchemy warning fails the suite instead of hiding in the log
    # third-party noise we cannot fix here: starlette's TestClient uses an alias that newer anyio deprecates
    "ignore:The anyio\\.abc\\..* alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/File() in parameter defaults is the framework idiom

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal fixtures read better on one line
