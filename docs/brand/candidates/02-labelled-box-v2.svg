<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="BoxMind">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1122"/><stop offset="1" stop-color="#171F3C"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#2A3566" stop-opacity=".55"/><stop offset="1" stop-color="#0C1122" stop-opacity="0"/></radialGradient>
<linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5584FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C63D6"/><stop offset="1" stop-color="#4E35A8"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B4C4FF"/><stop offset="1" stop-color="#CDB8FF"/></linearGradient>
<linearGradient id="tag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#FFA640"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="tagShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#vig)"/>
<!-- ground shadow -->
<ellipse cx="520" cy="880" rx="330" ry="46" fill="#05070F" fill-opacity=".7" filter="url(#soft)"/>
<!-- box: top, right side, front -->
<polygon points="196,392 716,392 836,272 316,272" fill="url(#top)"/>
<polygon points="716,392 836,272 836,752 716,872" fill="url(#side)"/>
<rect x="196" y="392" width="520" height="480" rx="22" fill="url(#front)"/>
<!-- lid seam and tape -->
<line x1="316" y1="332" x2="716" y2="332" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="4"/>
<polygon points="426,392 486,392 606,272 546,272" fill="#FFFFFF" fill-opacity=".22"/>
<rect x="426" y="392" width="60" height="480" fill="#FFFFFF" fill-opacity=".16"/>
<!-- tag shadow on the box -->
<g transform="rotate(-14 760 470)"><rect x="672" y="320" width="196" height="276" rx="30" fill="#05070F" fill-opacity=".45" filter="url(#tagShadow)"/></g>
<!-- string from the corner to the tag hole -->
<path d="M836,272 C 818,300 790,318 780,344" fill="none" stroke="#F6EEDC" stroke-width="9" stroke-linecap="round"/>
<!-- tag -->
<g transform="rotate(-14 760 470)">
  <rect x="660" y="312" width="196" height="276" rx="30" fill="url(#tag)"/>
  <circle cx="758" cy="356" r="22" fill="#0C1122" fill-opacity=".8"/>
  <circle cx="758" cy="356" r="10" fill="url(#tag)"/>
  <rect x="704" y="420" width="108" height="24" rx="12" fill="#5A3A0E" fill-opacity=".7"/>
  <rect x="704" y="470" width="70" height="24" rx="12" fill="#5A3A0E" fill-opacity=".7"/>
</g>
</svg>